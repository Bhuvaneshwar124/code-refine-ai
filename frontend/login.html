<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Code Review & Rewrite Agent - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
            min-height: 100vh;
            font-family: 'Inter', 'Segoe UI', sans-serif;
        }
        .glass-card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(99, 102, 241, 0.2);
        }
        .glow-btn {
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            box-shadow: 0 0 25px rgba(99, 102, 241, 0.4);
            transition: all 0.3s ease;
        }
        .glow-btn:hover {
            box-shadow: 0 0 40px rgba(99, 102, 241, 0.6);
            transform: translateY(-2px);
        }
        .input-field {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(99, 102, 241, 0.3);
            transition: all 0.3s ease;
        }
        .input-field:focus {
            border-color: #6366f1;
            box-shadow: 0 0 15px rgba(99, 102, 241, 0.2);
            outline: none;
        }
        .floating-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.15;
            animation: float 8s ease-in-out infinite;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-30px) scale(1.1); }
        }
        .code-rain {
            position: absolute;
            font-family: 'Courier New', monospace;
            color: rgba(99, 102, 241, 0.08);
            font-size: 14px;
            white-space: nowrap;
            animation: rain 15s linear infinite;
        }
        @keyframes rain {
            0% { transform: translateY(-100%); }
            100% { transform: translateY(100vh); }
        }
    </style>
</head>
<body class="flex items-center justify-center relative overflow-hidden">
    <!-- Background effects -->
    <div class="floating-orb w-96 h-96 bg-indigo-600 top-10 -left-20" style="animation-delay: 0s;"></div>
    <div class="floating-orb w-80 h-80 bg-purple-600 bottom-10 -right-20" style="animation-delay: 3s;"></div>
    <div class="floating-orb w-64 h-64 bg-blue-600 top-1/2 left-1/2" style="animation-delay: 5s;"></div>

    <!-- Code rain decoration -->
    <div class="code-rain" style="left: 5%; animation-delay: 0s;">if(code.quality === "high") { deploy(); }</div>
    <div class="code-rain" style="left: 25%; animation-delay: 3s;">const review = await ai.analyze(code);</div>
    <div class="code-rain" style="left: 55%; animation-delay: 6s;">function optimize(src) { return clean(src); }</div>
    <div class="code-rain" style="left: 80%; animation-delay: 9s;">// AI-powered code refactoring</div>

    <!-- Login Card -->
    <div class="glass-card rounded-2xl p-10 w-full max-w-md mx-4 shadow-2xl relative z-10">
        <!-- Logo / Header -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-20 h-20 rounded-2xl bg-gradient-to-br from-indigo-500 to-purple-600 mb-4 shadow-lg">
                <span class="text-4xl">🤖</span>
            </div>
            <h1 class="text-3xl font-bold text-white mb-2">CodeRefine AI</h1>
            <p class="text-slate-400 text-sm">AI Code Review & Rewrite Agent</p>
        </div>

        <!-- Login Form -->
        <form id="loginForm" class="space-y-5">
            <div>
                <label class="block text-sm font-medium text-slate-300 mb-2">
                    <i class="fas fa-user mr-2 text-indigo-400"></i>Username
                </label>
                <input type="text" id="username" placeholder="Enter your username"
                    class="input-field w-full px-4 py-3 rounded-xl text-white placeholder-slate-500">
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-300 mb-2">
                    <i class="fas fa-lock mr-2 text-indigo-400"></i>Password
                </label>
                <input type="password" id="password" placeholder="Enter your password"
                    class="input-field w-full px-4 py-3 rounded-xl text-white placeholder-slate-500">
            </div>

            <div id="error-msg" class="hidden text-red-400 text-sm text-center bg-red-900/20 rounded-lg py-2">
                <i class="fas fa-exclamation-circle mr-1"></i>
                <span></span>
            </div>

            <button type="submit"
                class="glow-btn w-full py-3.5 rounded-xl text-white font-semibold text-lg tracking-wide">
                <i class="fas fa-sign-in-alt mr-2"></i>Login
            </button>
        </form>

        <div class="mt-6 text-center">
            <p class="text-slate-500 text-xs">Powered by <span class="text-indigo-400 font-medium">Groq × Llama 3.3 70B</span></p>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            const errorDiv = document.getElementById('error-msg');

            if (!username || !password) {
                errorDiv.classList.remove('hidden');
                errorDiv.querySelector('span').textContent = 'Please fill in all fields.';
                return;
            }

            // Simple client-side check (you can add real auth later)
            if (username && password) {
                errorDiv.classList.add('hidden');
                window.location.href = '/tool';
            }
        });
    </script>
</body>
</html>
